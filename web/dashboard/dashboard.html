<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to the Sequence Analyzer &middot; DNAnalyzer</title>
    <!-- The old API-only dashboard has been retired. Its charts now live in the
         on-device analyzer. This page is a client-side redirect that keeps the
         old path alive. It intentionally loads NO api-client.js. -->
    <meta http-equiv="refresh" content="0; url=../analyzer/analyzer.html">
    <link rel="canonical" href="../analyzer/analyzer.html">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="shortcut icon" href="../assets/icons/Icon_Dark_BG.svg" type="image/svg+xml">
    <script>
        // Immediate client-side redirect (replace() so Back does not loop here).
        window.location.replace("../analyzer/analyzer.html");
    </script>
</head>
<body>
    <main class="container" style="max-width:640px;margin-top:16vh;text-align:center;">
        <span class="label label--accent">Moved</span>
        <h1 style="margin-top:var(--sp-3);">The dashboard is now the Analyzer.</h1>
        <p class="soft" style="margin:var(--sp-4) auto 0;">Its charts now live in the on-device DNA Sequence Analyzer, which runs entirely in your browser with no server. Redirecting you now.</p>
        <p style="margin-top:var(--sp-5);"><a class="btn btn-primary" href="../analyzer/analyzer.html">Open the Analyzer</a></p>
    </main>
</body>
</html>
